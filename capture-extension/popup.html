<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><style>body{font:13px -apple-system,BlinkMacSystemFont,sans-serif;width:260px;padding:14px}label{display:block;margin:8px 0}input{width:70px}button{margin:4px 4px 0 0;padding:6px 10px}#status{white-space:pre-wrap;color:#555;margin-top:10px}</style></head>
  <body>
    <strong>Job Lens OCR</strong>
    <label>采集数量 <input id="limit" type="number" min="0" max="10000" value="0"></label>
    <small>填 0：持续采集到列表结束</small>
    <div><button id="start">开始采集</button><button id="stop">停止采集</button></div>
    <div id="status">请在 BOSS 岗位列表页使用。</div>
    <script src="popup.js"></script>
  </body>
</html>
